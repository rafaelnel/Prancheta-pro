name: Deploy para GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_configured: ${{ steps.pages.outcome }}
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Verificar tipos TypeScript
        run: npm run lint

      - name: Executar testes do motor, mercado e configuração
        run: npx tsx --test src/engine/matchEngine.test.ts src/engine/contractEngine.test.ts src/engine/retirementAndLineup.test.ts src/engine/transferEngine.test.ts src/utils/firebaseConfig.test.ts

      - name: Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - name: Gerar build de produção (Vite)
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_DATABASE_ID: ${{ secrets.VITE_FIREBASE_DATABASE_ID }}
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if [ -n "$PAGES_BASE_PATH" ]; then
            export VITE_BASE_PATH="${PAGES_BASE_PATH%/}/"
          elif echo "$REPO_NAME" | grep -qi '\.github\.io$'; then
            export VITE_BASE_PATH="/"
          else
            export VITE_BASE_PATH="/${REPO_NAME}/"
          fi
          echo "Building with VITE_BASE_PATH=${VITE_BASE_PATH}"
          npm run build

      - name: Publicar backup na branch gh-pages
        id: gh_pages
        uses: peaceiris/actions-gh-pages@v4
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true

      - name: Verificar destino de publicação
        if: steps.pages.outcome != 'success' && steps.gh_pages.outcome != 'success'
        run: |
          echo "::error::Nenhum método de publicação do GitHub Pages está habilitado. Acesse Settings -> Pages -> Source e selecione 'GitHub Actions' (recomendado), ou habilite 'Read and write permissions' em Settings -> Actions -> General."
          exit 1

      - name: Enviar artefato do GitHub Pages (./dist)
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    if: needs.build.outputs.pages_configured == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
