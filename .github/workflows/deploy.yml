name: Deploy para GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm install

      - name: Gerar build de produção (Vite)
        run: npm run build

      - name: Publicar na branch gh-pages (compatível com Deploy from a branch)
        uses: peaceiris/actions-gh-pages@v4
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true

      - name: Configurar GitHub Pages (modo GitHub Actions)
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Enviar artefato estático (./dist)
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: ./dist

      - name: Publicar no GitHub Pages (modo GitHub Actions)
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
