    <script>
      // Remove Service Workers e caches antigos de outros projetos no mesmo domínio github.io (ex: Mais-saudavel)
      (function () {
        try {
          if ('caches' in window) {
            caches.keys().then(function (keys) {
              for (var j = 0; j < keys.length; j++) {
                caches.delete(keys[j]);
              }
            });
          }
          if ('serviceWorker' in navigator) {
            var hadController = Boolean(navigator.serviceWorker.controller);
            navigator.serviceWorker.getRegistrations().then(function (registrations) {
              if (registrations.length > 0) {
                Promise.all(
                  registrations.map(function (reg) {
                    return reg.unregister();
                  })
                ).then(function () {
                  if (hadController && !sessionStorage.getItem('prancheta_sw_cleaned')) {
                    sessionStorage.setItem('prancheta_sw_cleaned', '1');
                    window.location.reload();
                  }
                });
              }
            });
          }
        } catch (e) {}
      })();
    </script>
