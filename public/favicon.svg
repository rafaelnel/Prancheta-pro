<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#171b24"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </linearGradient>
    <linearGradient id="boardGrad" x1="88" y1="76" x2="424" y2="452" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a221f"/>
      <stop offset="100%" stop-color="#0f1318"/>
    </linearGradient>
    <linearGradient id="limeGrad" x1="120" y1="80" x2="400" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ccff33"/>
      <stop offset="100%" stop-color="#9be600"/>
    </linearGradient>
  </defs>
  <!-- Rounded App Tile Background -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  <rect x="10" y="10" width="492" height="492" rx="106" stroke="#b5ff00" stroke-opacity="0.22" stroke-width="6"/>

  <!-- Tactical Clipboard Body -->
  <rect x="84" y="88" width="344" height="364" rx="46" fill="url(#boardGrad)" stroke="url(#limeGrad)" stroke-width="16"/>

  <!-- Clipboard Top Clasp -->
  <rect x="180" y="54" width="152" height="58" rx="22" fill="#0b0c10" stroke="url(#limeGrad)" stroke-width="14"/>
  <circle cx="256" cy="83" r="10" fill="#b5ff00"/>

  <!-- Football Pitch Markings inside Clipboard -->
  <line x1="92" y1="270" x2="420" y2="270" stroke="#b5ff00" stroke-opacity="0.32" stroke-width="8"/>
  <circle cx="256" cy="270" r="56" stroke="#b5ff00" stroke-opacity="0.34" stroke-width="8"/>
  <circle cx="256" cy="270" r="9" fill="#b5ff00" fill-opacity="0.5"/>
  <!-- Top & Bottom Penalty Areas -->
  <rect x="172" y="96" width="168" height="60" rx="6" stroke="#b5ff00" stroke-opacity="0.28" stroke-width="8"/>
  <rect x="172" y="384" width="168" height="60" rx="6" stroke="#b5ff00" stroke-opacity="0.28" stroke-width="8"/>

  <!-- Tactical Play Curve & Arrowhead -->
  <path d="M168 364 C 174 294, 214 268, 258 242 C 296 220, 322 198, 336 164" stroke="#b5ff00" stroke-width="14" stroke-linecap="round" stroke-dasharray="22 18"/>
  <path d="M306 168 L340 152 L346 190" stroke="#b5ff00" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Tactical X Markers (Opponents / Zones) -->
  <g stroke="#ffffff" stroke-opacity="0.88" stroke-width="12" stroke-linecap="round">
    <line x1="316" y1="334" x2="348" y2="366"/>
    <line x1="348" y1="334" x2="316" y2="366"/>
    <line x1="164" y1="186" x2="196" y2="218"/>
    <line x1="196" y1="186" x2="164" y2="218"/>
  </g>

  <!-- Player Token (Start) -->
  <circle cx="168" cy="364" r="28" fill="#f8fafc" stroke="#0b0c10" stroke-width="10"/>
  <!-- Midfield Relay Token -->
  <circle cx="256" cy="244" r="26" fill="#b5ff00" stroke="#0b0c10" stroke-width="10"/>
  <!-- Ball / Target Finish Accent -->
  <circle cx="342" cy="148" r="24" fill="#ffffff" stroke="#0b0c10" stroke-width="9"/>
  <circle cx="342" cy="148" r="8" fill="#0b0c10"/>
</svg>
